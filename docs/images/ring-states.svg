<svg xmlns="http://www.w3.org/2000/svg" width="464" height="120" viewBox="0 0 464 120" role="img" aria-labelledby="title desc">
  <title id="title">Panel halkası renk ve doluluk örnekleri / Panel ring color and fill examples</title>
  <desc id="desc">Soldan sağa yüzde 80 yeşil, yüzde 40 sarı, yüzde 20 kırmızı kalan kullanım ve veri yokken gri halka.</desc>
  <rect width="464" height="120" rx="17" fill="#202020"/>
  <g fill="none" stroke-width="6" transform="rotate(-90 58 49)">
    <circle cx="58" cy="49" r="23" stroke="#777777"/>
    <circle cx="58" cy="49" r="23" stroke="#74d5bb" stroke-dasharray="115.61 144.51"/>
  </g>
  <g fill="none" stroke-width="6" transform="rotate(-90 174 49)">
    <circle cx="174" cy="49" r="23" stroke="#777777"/>
    <circle cx="174" cy="49" r="23" stroke="#f0b86d" stroke-dasharray="57.81 144.51"/>
  </g>
  <g fill="none" stroke-width="6" transform="rotate(-90 290 49)">
    <circle cx="290" cy="49" r="23" stroke="#777777"/>
    <circle cx="290" cy="49" r="23" stroke="#ef7878" stroke-dasharray="28.90 144.51"/>
  </g>
  <circle cx="406" cy="49" r="23" fill="none" stroke="#777777" stroke-width="6"/>
  <g fill="#e8e8e8" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="58" y="102">80%</text>
    <text x="174" y="102">40%</text>
    <text x="290" y="102">20%</text>
    <text x="406" y="102">—</text>
  </g>
</svg>
